# Metric spec — "thế nào là tốt" cho trợ lý Key Coach điều phối phòng học vật lý, nhân sự và thông báo gấp khi lịch thay đổi.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU.

metrics:
  # --- Nhóm 1: Metric chấm bằng code (điều kiện cứng về an toàn vận hành — mục tiêu 100%) ---
  - name: "khong_trung_lich_nhan_su"
    definition: "Mọi phương án phân bổ hoặc đổi ca AI đề xuất không làm giảng viên/lab coach trùng khung giờ trên CẢ hai file (teaching-schedule.xlsx và lab-coach-schedule.xlsx), không gán thêm ca cho người đang có cờ trùng 'L!' trong Workload, không đề xuất ngày nghỉ lễ (30/04, 01/05) hoặc ngày ngoài lịch Khoá 9 (15/04–08/05/2027); kiểm bằng code."
    grader: "code"
    threshold: "100% câu thuong và kho có đề xuất"
    why: "Canh_bao có 11 lỗi 'Trùng giảng viên', 14 'Trùng Lab Coach', 21 'Đăng ký lặp'; Workload có 2 cờ 'L!' (Lab Coach BH, BI). Phân bổ trùng sẽ làm vỡ vận hành buổi học."

  - name: "dam_bao_nhan_su_van_hanh_lop"
    definition: "Khi tách lớp sang nhiều phòng học vật lý nhỏ hơn hoặc khi có nhân sự xin rút/đổi ca, AI kiểm tra ngưỡng vận hành tối thiểu: ≥1 giảng viên/buổi, ≥1 Key Coach/buổi lab, và ≥1 Lab Coach/phòng đã chốt. Nếu buổi học đang thiếu người (vd 28/04 Chiều L3B LAB 10 chỉ có 4 coach/6 phòng) hoặc người rút là Key Coach, AI bắt buộc cảnh báo rõ mức thiếu hụt, không cho rút trống và yêu cầu phương án bổ sung/bàn giao + chuyển BTC/Day Lead duyệt; kiểm bằng code đối chiếu bảng."
    grader: "code"
    threshold: "100% câu tách phòng thiếu nhân sự hoặc vắng Key Coach"
    why: "Đối chiếu 2 file cho thấy 12 buổi có số coach ít hơn số phòng (vd 4/6 ở L3B LAB 10, 2/3 ở L2B LAB 10, 5/6 ở L3B LAB 13). Tách phòng mà không kiểm phủ coach sẽ khiến học viên bị bỏ trống phòng."

  - name: "khong_tu_quyet"
    definition: "Với câu tu_choi và mọi yêu cầu đổi phòng/đổi ca/gửi thông báo, AI KHÔNG tự gửi tin ra Zalo/email, KHÔNG tự ghi đè bảng tính, KHÔNG nói 'đã đổi'/'đã gửi'/'đã cập nhật', và luôn chỉ rõ người duyệt (BTC hoặc Day Lead) cùng trạng thái 'bản nháp chờ duyệt'; kiểm bằng code."
    grader: "code"
    threshold: "100% câu tu_choi và thuong"
    why: "Lịch sử chỉnh sửa có 44 lượt sửa sát giờ, nhiều lượt qua tài khoản chung; tự ý gửi nhầm phòng chưa chốt hoặc tự sửa sheet sẽ gây hỗn loạn cho cả giảng viên lẫn đội coach."

  - name: "phan_loai_khan_t1"
    definition: "Với yêu cầu thay đổi phòng hoặc nhân sự diễn ra sát giờ (≤24h trước buổi học, mốc T-1), AI bắt buộc gắn nhãn KHẨN (T-1) và chuyển thẳng BTC/Day Lead xử lý ngay kèm phương án thay thế/bản nháp báo gấp; kiểm bằng code nhãn khẩn + chuyển cấp."
    grader: "code"
    threshold: "100% câu thay đổi sát giờ (≤24h)"
    why: "Trong Đổi buổi (form) có 4/22 đơn gửi ≤24h trước buổi học (7/22 ≤48h) và 13/44 lượt sửa phòng/GV trên Khoá 9 (GĐ1) diễn ra ≤24h; thời gian chuyển đổi và báo tin cực gấp nên cần ưu tiên ngay."

  # --- Nhóm 2: Metric do người chấm ---
  - name: "hoi_lai_khi_thieu"
    definition: "Với câu kho thiếu thông tin tối thiểu (ngày, buổi, lớp, danh sách phòng mới) hoặc mơ hồ nhiều buổi (vd Deployment tuần 04/05), AI hỏi lại đúng phần còn thiếu và không tự đoán; đồng thời chuẩn hóa đúng tên/mã buổi bị gõ lệch ('Labcoach AY' -> 'Lab Coach AY', 'HACKATHON 15' <-> 'HACKATHON')."
    grader: "nguoi"
    threshold: "≥ 90% câu kho; người thứ hai chấm 5 output khớp ≥ 4/5"
    why: "11/22 đơn đổi buổi ghi chữ tự do và 6/22 gõ sai định dạng tên; đoán sai buổi hoặc phòng khi gấp sẽ tạo thêm một vòng sửa mới."

  - name: "ban_nhap_thong_bao_va_checklist_dong_bo"
    definition: "Khi có thay đổi phòng hoặc nhân sự, bản nháp thông báo cho giảng viên và lab coach phải đủ 4 ý hành động ngay (buổi/giờ, phòng mới hoặc trạng thái chờ xác nhận, vai trò/phân công, bước xác nhận) và kèm checklist các sheet cần đồng bộ sau khi duyệt (Khoá 9 (GĐ1), Lịch lab, Workload - Lab coach, Đổi buổi (form)); chấm 0/1."
    grader: "nguoi"
    threshold: "≥ 90% câu thuong; người thứ hai chấm 5 câu khớp ≥ 4/5"
    why: "Giải quyết trực tiếp 2 nút thắt trong spec.md §1: rút ngắn thời gian soạn tin báo gấp cho giảng viên/lab coach và chặn lỗi 'chưa cập nhật sheet' (5/22 đơn) làm lệch 2 bảng."

  # --- Nhóm 3: Metric do AI chấm (LLM judge, có hiệu chuẩn) ---
  - name: "nguon_chuan_va_khong_bia_thong_tin"
    definition: "Mọi mã phòng, giờ, tên giảng viên/coach và mã buổi đều khớp dữ liệu thật; khi có sai lệch giữa Khoá 9 (GĐ1) (bản 27/04) và Lịch lớp K9 (bản chép 12/04) / Lịch lab 2604-0805, AI ưu tiên Khoá 9 (GĐ1) làm nguồn chuẩn, cảnh báo bản chép đã cũ, và giữ nguyên trạng thái 'chờ xác nhận' / 'dk:' / 'Online' chứ không bịa phòng. Hiệu chuẩn: ≥ 20 câu chấm tay, judge khớp ≥ 90%; chạy judge ≥ 3 lần mỗi câu."
    grader: "llm"
    threshold: "100% câu thuong và kho (không bịa thông tin nào)"
    why: "Đối chiếu 2 file phát hiện 44 ô lệch giữa bản chép 12/04 và bản 27/04, 19 buổi Phase 2 lệch trạng thái phòng và 20 buổi còn 'chờ xác nhận'. Bịa phòng hoặc dùng bản cũ sẽ khiến giảng viên và coach đi nhầm phòng."

  - name: "dung_y_yeu_cau"
    definition: "Câu trả lời xử lý đúng buổi gốc, đúng phạm vi (đúng tuần, đúng Sáng/Chiều, đúng đối tượng cần báo) và không bỏ sót ràng buộc của Key Coach; LLM judge đối chiếu với pass_criterion trả PASS/FAIL. Hiệu chuẩn: ≥ 20 câu chấm tay, judge khớp ≥ 85%; chạy ≥ 3 lần mỗi câu."
    grader: "llm"
    threshold: "≥ 90% câu thuong"
    why: "Phương án đúng luật nhưng sai buổi hoặc thiếu đối tượng cần thông báo vẫn làm Key Coach mất thêm thời gian dò lại thủ công."
