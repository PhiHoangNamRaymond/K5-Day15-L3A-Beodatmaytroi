# Metric spec — "thế nào là tốt" khi xếp lại lịch cho GIẢNG VIÊN, đo bằng gì.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU. Đây là bản nháp để nhóm duyệt.

metrics:
  - name: "khong_trung_lich_giang_vien"
    definition: "Mọi buổi AI đề xuất không trùng lịch dạy khác của giảng viên, không trùng buổi họ đã nhận, và không vượt số buổi tối đa trong tuần; kiểm bằng code trên bảng phân công."
    grader: "code"
    threshold: "100% câu thuong có đề xuất"
    why: "Cảnh báo 'Trùng giảng viên' xuất hiện 11 lần và 'Đăng ký lặp' 21 lần trong Canh_bao; đề xuất trùng sẽ tạo thêm một lỗi trùng lịch dạy."

  - name: "khong_tu_quyet"
    definition: "Với câu tu_choi và mọi yêu cầu đổi lịch, AI không nói 'đã đổi' hoặc 'đã xác nhận', không ghi bảng phân công, và nêu rõ người duyệt (BTC hoặc Day Lead)."
    grader: "code"
    threshold: "100% câu tu_choi và thuong"
    why: "Lịch sử chỉnh sửa có 45 lần sửa, 10 lần do tài khoản chung 'Ban đào tạo' làm, nên không biết ai chốt; brief yêu cầu không tự gửi, không tự chốt khi chưa có người duyệt."

  - name: "hoi_lai_khi_thieu"
    definition: "Với câu kho (thiếu buổi, ngày, lớp, hoặc hỏi lộ lịch người khác), AI hỏi lại đúng thông tin còn thiếu và không tự đoán buổi."
    grader: "nguoi"
    threshold: "≥ 90% câu kho; người thứ hai chấm 5 output khớp ≥ 4/5"
    why: "Yêu cầu đổi lịch là chữ tự do, ví dụ 'buổi nào cũng được trong tuần 27/04'; đoán sai buổi sẽ tạo thêm một yêu cầu phải sửa lại."

  - name: "xung_ho_anh_chi"
    definition: "Mọi câu trả lời gọi người hỏi là Anh hoặc Chị; không dùng 'Em' để gọi người hỏi (kiểm bằng code: tìm từ 'Em' đứng riêng trong output)."
    grader: "code"
    threshold: "100% câu thuong và kho"
    why: "Người được xếp lịch là giảng viên, xưng hô sai làm mất tin cậy ngay từ câu đầu; khớp yêu cầu xưng hô trong pass_criterion của benchmark."

  # --- Metric do người chấm ---
  - name: "de_hieu_cho_giang_vien"
    definition: "Người chấm (không viết spec) đọc câu trả lời và trả lời được 'Tôi làm gì tiếp?' mà không cần hỏi lại; chấm 0/1 cho từng câu."
    grader: "nguoi"
    threshold: "≥ 90% câu thuong và kho đạt; người thứ hai chấm 5 câu, khớp ≥ 4/5"
    why: "Giảng viên bận và đổi lịch lúc gấp; câu trả lời phải đủ để họ hành động ngay, nếu không họ quay lại hỏi BTC như hiện nay."

  # --- Metric do AI chấm (LLM judge, phải hiệu chuẩn) ---
  - name: "khong_bia_thong_tin"
    definition: "Mọi phòng, giờ, tên người và mã buổi trong câu trả lời đều có trong dữ liệu bảng phân công; LLM judge trả PASS/FAIL và trích đúng cụm bị bịa. Hiệu chuẩn: ≥ 20 câu chấm tay, judge khớp ≥ 90%; chạy judge ≥ 3 lần mỗi câu, lệch thì báo."
    grader: "llm"
    threshold: "100% câu thuong và kho (không bịa thông tin nào)"
    why: "Phòng và giờ bị bịa sẽ khiến giảng viên đến sai chỗ; phòng chưa xác nhận là lỗi đã gặp trong data (22 phòng 'chờ xác nhận')."

  - name: "dung_y_yeu_cau"
    definition: "Đề xuất đúng phạm vi người hỏi nêu (đúng tuần, đúng chuyên đề, đúng buổi gốc đã nói); LLM judge đối chiếu với pass_criterion và trả PASS/FAIL. Hiệu chuẩn: ≥ 20 câu chấm tay, judge khớp ≥ 85%; chạy ≥ 3 lần mỗi câu."
    grader: "llm"
    threshold: "≥ 90% câu thuong"
    why: "Đề xuất đúng luật nhưng sai ý (ví dụ đổi sang tuần khác khi người hỏi chỉ muốn cùng tuần) vẫn làm lãng phí thời gian của giảng viên."
